name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests
        run: bash gradlew --no-daemon test

      - name: Build executable JARs
        run: bash gradlew --no-daemon loaderJar shadowJar

      - name: Upload executable JAR
        uses: actions/upload-artifact@v7
        with:
          name: usefulbot-build-${{ github.run_number }}
          path: implements/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
